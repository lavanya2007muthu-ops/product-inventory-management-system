<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog - Inventory Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <nav>
                <div class="logo">Your Website</div>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="add-item.html">Add Item</a></li>
                    <li><a href="product-view.html">Work</a></li>
                    <li><a href="gst-calc.html">Info</a></li>
                </ul>
                <a href="index.html#dashboard" class="btn-primary">Dashboard</a>
            </nav>
        </div>
    </header>

    <main class="container" style="padding-top: 10rem;">
        <div class="hero-content fade-up" style="max-width: 800px; margin: 0 auto 4rem; text-align: center;">
            <h1 style="font-size: 3.5rem;">Product Catalog</h1>
            <p>Browse, manage, and track your entire inventory collection with highly detailed views and real-time updates.</p>
        </div>

        <div class="section-header fade-up">
            <h2>Inventory List</h2>
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Search products...">
            </div>
        </div>

        <div class="table-container fade-up" style="margin-bottom: 5rem;">
            <table id="itemsTable">
                <thead>
                    <tr>
                        <th>Image</th>
                        <th>Name</th>
                        <th>Category</th>
                        <th>Quantity</th>
                        <th>Price</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="itemsBody">
                    <!-- Items will be inserted here -->
                </tbody>
            </table>
        </div>

        <!-- Edit Modal -->
        <div id="editModal" class="modal">
            <div class="modal-content">
                <span class="close" onclick="closeModal()">&times;</span>
                <h2 style="margin-bottom: 2rem;">Edit Product</h2>
                <form id="editForm">
                    <input type="hidden" id="editId">
                    <div class="form-group">
                        <label for="editName">Product Name</label>
                        <input type="text" id="editName" required>
                    </div>
                    <div class="form-group">
                        <label for="editQuantity">Quantity</label>
                        <input type="number" id="editQuantity" required>
                    </div>
                    <div class="form-group">
                        <label for="editPrice">Price (₹)</label>
                        <input type="number" step="0.01" id="editPrice" required>
                    </div>
                    <div class="form-group">
                        <label for="editCategory">Category</label>
                        <input type="text" id="editCategory">
                    </div>
                    <div class="form-group">
                        <label for="editImage">Product Image</label>
                        <input type="file" id="editImage" accept="image/*">
                    </div>
                    <div class="form-group">
                        <label for="editDescription">Description</label>
                        <textarea id="editDescription"></textarea>
                    </div>
                    <button type="submit" class="btn-primary" style="width: 100%;">Save Changes</button>
                </form>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
