<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GST & Denomination - Inventory Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <nav>
                <div class="logo">Your Website</div>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="add-item.html">Add Item</a></li>
                    <li><a href="product-view.html">Work</a></li>
                    <li><a href="gst-calc.html">Info</a></li>
                </ul>
                <a href="index.html#dashboard" class="btn-primary">Dashboard</a>
            </nav>
        </div>
    </header>

    <main class="container" style="padding-top: 10rem;">
        <div class="hero-content fade-up" style="max-width: 800px; margin: 0 auto 4rem; text-align: center;">
            <h1 style="font-size: 3.5rem;">GST & Denomination</h1>
            <p>Accurately calculate tax and breakdown currency denominations with our high-precision financial tools.</p>
        </div>

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 3rem; margin-bottom: 5rem;">
            <div class="table-container fade-up" style="padding: 3rem; border-radius: 30px;">
                <h2 style="margin-bottom: 2rem;">GST Calculator</h2>
                <form id="gstForm">
                    <div class="form-group">
                        <label for="basePrice">Base Price (₹)</label>
                        <input type="number" id="basePrice" placeholder="0.00" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label for="gstRate">GST Rate (%)</label>
                        <input type="number" id="gstRate" placeholder="18" step="0.01" required>
                    </div>
                    <button type="submit" class="btn-primary" style="width: 100%;">Calculate GST</button>
                </form>
                <div id="gstResult" style="margin-top: 2rem; display: none; padding: 1.5rem; background: #f8fafc; border-radius: 12px;">
                    <p style="margin-bottom: 0.5rem;"><strong>GST Amount:</strong> <span style="color: var(--primary); font-weight: 700;">₹<span id="gstAmount">0</span></span></p>
                    <p><strong>Total Price:</strong> <span style="color: var(--secondary); font-weight: 700;">₹<span id="totalPrice">0</span></span></p>
                </div>
            </div>

            <div class="table-container fade-up" style="padding: 3rem; border-radius: 30px;">
                <h2 style="margin-bottom: 2rem;">Currency Denomination</h2>
                <form id="denomForm">
                    <div class="form-group">
                        <label for="amount">Total Amount (₹)</label>
                        <input type="number" id="amount" placeholder="0.00" step="0.01" required>
                    </div>
                    <button type="submit" class="btn-primary" style="width: 100%;">Calculate Breakdown</button>
                </form>
                <div id="denomResult" style="margin-top: 2rem; display: none;">
                    <h3 style="font-size: 1rem; margin-bottom: 1rem; color: var(--text-muted);">Denomination Breakdown</h3>
                    <div id="denomBreakdown" style="display: grid; gap: 0.5rem;"></div>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
    <script src="gst-script.js"></script>
</body>
</html>
